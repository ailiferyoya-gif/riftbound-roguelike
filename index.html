    function playerAction(type,skill){if(!run||run.busy||run.phase!=='room'||!run.enemy||run.resolved)return;const hero=heroById(run.heroId);run.busy=true;run.anim=type==='skill'?'skill':type==='heal'?'heal':'player';let damage=0,message='';if(type==='attack'){damage=run.atk+Math.floor(Math.random()*7);if(run.relics.includes('blood'))damage+=6;message='通常攻撃。'+damage+'ダメージ。';sfx.attack()}else if(type==='skill'){if(!skill||run.mp<skill.cost){toast('MPが足りません');run.busy=false;run.anim='idle';return}run.mp-=skill.cost;const values={crescent:28,flare:38,shatter:32,ward:16,prayer:18,starfall:46,riposte:34,tide:34,undertow:42,hex:45,omen:24,hammer:42,fortress:30,flash:36,jackpot:27,null:50,echo:22,temper:48,overclock:44};damage=values[skill.id]??(hero.atk+18);if(run.relics.includes('ember'))damage+=8;if(['prayer','tide','echo'].includes(skill.id)){const heal=Math.min(skill.id==='tide'?32:22,run.maxHp-run.hp);run.hp+=heal;addLog(skill.name+'でHPが'+heal+'回復した。','good')}if(['ward','bulwark','fortress','echo'].includes(skill.id)){const guard=skill.id==='fortress'?38:skill.id==='bulwark'?30:skill.id==='echo'?12:16;run.ward+=guard;addLog('守りを'+guard+'得た。','good')}if(['crescent','bulwark','riposte','omen','hammer','temper'].includes(skill.id))run.nextAttack=(run.nextAttack||0)+(skill.id==='hammer'?14:10);if(skill.id==='jackpot'){run.gold+=40;addLog('大当たりで40Gを得た。','rare')}message=skill.name+'。'+damage+'ダメージ。';sfx.skill()}else if(type==='guard'){run.ward+=18;message='身構えた。守り+18。';sfx.click()}else if(type==='heal'){if(run.potions<1||run.hp>=run.maxHp){run.busy=false;run.anim='idle';return}run.potions--;const heal=Math.min(22+(run.relics.includes('tonic')?15:0),run.maxHp-run.hp);run.hp+=heal;message='トニックでHPが'+heal+'回復。';sfx.heal()}if(run.nextAttack&&type==='attack'){damage+=run.nextAttack;run.nextAttack=0}if(damage){run.enemy.hp=Math.max(0,run.enemy.hp-damage);addLog(message,'good')}else addLog(message,'good');render();vibrate();setTimeout(()=>{if(!run||ui.screen!=='run')return;if(run.enemy.hp<=0){finishBattle();return}enemyTurn()},type==='skill'?560:430)}
    function finishBattle(){if(!run||!run.enemy)return;const enemy=run.enemy,found=Math.round(enemy.reward*run.goldMult);run.gold+=found;run.kills++;profile.stats.kills++;if(!profile.codex.includes(enemy.id))profile.codex.push(enemy.id);profile.mastery[run.heroId]=(profile.mastery[run.heroId]||0)+1;unlockAchievement('achievement-'+Math.min(100,profile.stats.kills));if(enemy.boss){run.phase='victory';run.anim='idle';bankRun(true);sfx.win();render();return}run.rewardOptions=relicPool();run.phase='reward';run.busy=false;run.anim='player';addLog(enemy.name+'を倒した。+'+found+'G','rare');sfx.gold();render();}
    function bankRun(win){if(!run||run.banked)return;run.banked=true;profile.gold+=Math.floor(run.gold);profile.mastery[run.heroId]=(profile.mastery[run.heroId]||0)+(win?3:1);if(win){profile.stats.wins++;profile.achievements.firstWin=true;profile.depth=Math.max(profile.depth,run.depth+1);unlockAchievement('achievement-1')}if(run.mode==='daily'&&win){profile.challengeWins++;unlockAchievement('achievement-4')}if(profile.stats.runs>=10){profile.achievements.tenRuns=true;unlockAchievement('achievement-2')}if(profile.depth>=3){profile.achievements.deep=true;unlockAchievement('achievement-3')}if(profile.unlockedHeroes.length===HEROES.length)profile.achievements.allHeroes=true;save();}
    function renderChallenges(){return '<section class="panel"><div class="section-label">CHALLENGES · 毎日変わる遊び方</div><p class="screen-subtitle">深度ルールと別モードで、同じ13部屋でも違う判断を迫られます。</p><div class="choice-list"><button class="choice" data-action="daily" style="--room-color:var(--violet)"><span class="choice-icon">✦</span><span class="choice-copy"><strong>デイリー裂け目</strong><small>今日の規則：'+DEPTH_RULES[(new Date().getDate())%DEPTH_RULES.length]+' · 報酬と実績対象</small></span><b>↗</b></button><button class="choice" data-action="bossrush" style="--room-color:var(--red)"><span class="choice-icon">♛</span><span class="choice-copy"><strong>ボス連戦</strong><small>深度に応じたボスと遺物ビルドを試す</small></span><b>↗</b></button></div></section><section class="panel"><div class="section-label">LONG RUN TRACKER</div><div class="stat-grid"><div class="stat"><strong>'+profile.challengeWins+'</strong><small>挑戦勝利</small></div><div class="stat"><strong>'+profile.codex.length+'/'+ENEMIES.length+'</strong><small>敵図鑑</small></div><div class="stat"><strong>'+profile.achievementSet.length+'/'+ACHIEVEMENTS.length+'</strong><small>実績</small></div><div class="stat"><strong>'+profile.cosmetics.length+'/'+COSMETICS.length+'</strong><small>外見</small></div></div></section><div class="tip">100時間向けの目標：10人の主人公、80種の遺物、24種の敵、8体のボス、深度ルール、呪い、実績、外見収集を少しずつ埋めていきます。</div>';}

    function startRun(depth=profile.depth,mode='standard'){const hero=heroById(profile.selectedHero),u=upgradeStats();run={heroId:hero.id,depth,mode,rule:mode==='daily'?DEPTH_RULES[new Date().getDate()%DEPTH_RULES.length]:DEPTH_RULES[depth%DEPTH_RULES.length],roomIndex:0,kind:null,region:0,maxHp:hero.hp+(u.hp||0)+(profile.upgrades.armor||0)*12,maxMp:hero.mp+(u.mp||0)+(profile.upgrades.focus||0)*3,hp:0,mp:0,atk:hero.atk+(u.atk||0),ward:0,potions:2+(profile.upgrades.alchemy||0),gold:0,goldMult:u.gold,busy:false,anim:'idle',enemy:null,event:null,resolved:false,phase:'room',relics:[],rewardOptions:[],rewardChosen:false,turn:0,log:[],banked:false,kills:0};run.hp=run.maxHp;run.mp=run.maxMp;profile.stats.runs++;save();ui.screen='run';enterRoom();sfx.click();vibrate();}

    function startRun(depth=profile.depth,mode='standard'){const hero=heroById(profile.selectedHero),u=upgradeStats(),build=riftBuildFor(profile.heroBuilds[hero.id]),route=mode==='bossrush'?['battle','boss','rest','boss','treasure','boss']:routeKinds,rule=mode==='daily'?DEPTH_RULES[new Date().getDate()%DEPTH_RULES.length]:mode==='weekly'?RIFT_WEEKLY_RULES[riftWeekIndex()%RIFT_WEEKLY_RULES.length]:DEPTH_RULES[depth%DEPTH_RULES.length],weeklyGold=mode==='weekly'&&rule.includes('ゴールド+40%')?.4:0;run={heroId:hero.id,buildId:build.id,buildName:build.name,depth,mode,rule,seed:(depth+1)*1000+profile.stats.runs,route,roomIndex:0,kind:null,region:0,maxHp:hero.hp+(u.hp||0)+(profile.upgrades.armor||0)*12+build.hp,maxMp:Math.max(4,hero.mp+(u.mp||0)+(profile.upgrades.focus||0)*3+build.mp),hp:0,mp:0,atk:Math.max(1,hero.atk+(u.atk||0)+build.atk),ward:mode==='weekly'&&rule.includes('守り')?30:build.id==='guardian'?8:0,potions:mode==='weekly'&&rule.includes('ポーションなし')?0:2+(profile.upgrades.alchemy||0)+profile.shopPotions,gold:0,goldMult:u.gold+(profile.shopGoldBonus||0)+weeklyGold+(build.id==='arcane'?.05:0),busy:false,anim:'idle',enemy:null,event:null,resolved:false,phase:'room',relics:[],rewardOptions:[],rewardChosen:false,turn:0,log:[],banked:false,kills:0,curseId:null,curseName:'',discoveryBonus:profile.shopDiscovery||0,nextAttack:0,lastAction:'',weeklyRule:rule};run.hp=run.maxHp;run.mp=run.maxMp;profile.stats.runs++;profile.shopPotions=0;profile.shopGoldBonus=0;profile.shopDiscovery=0;riftClearCycle();save();ui.screen='run';enterRoom();sfx.click();vibrate();}
    function enterRoom(){const route=run.route||routeKinds;run.kind=route[run.roomIndex];run.region=run.kind==='boss'?3:Math.min(2,Math.floor(run.roomIndex/3));run.enemy=null;run.event=null;run.resolved=false;run.rewardChosen=false;run.rewardOptions=[];run.phase='room';run.anim='idle';run.busy=false;run.ward=run.buildId==='guardian'?8:0;run.log=[];profile.stats.rooms++;if(run.kind==='battle'||run.kind==='elite'||run.kind==='boss'){run.enemy=makeEnemy(run.kind);addLog(run.kind==='boss'?'最後の冠が、あなたの名前を呼んだ。':'裂け目から新しい敵が現れた。','danger')}if(run.kind==='event'){const base=EVENTS[(run.roomIndex+run.depth+run.seed)%EVENTS.length],branch=RIFT_EVENT_BRANCHES[(run.roomIndex+run.depth+run.seed)%RIFT_EVENT_BRANCHES.length];run.event={...base,choices:branch.choices.map(c=>({...c}))};}riftSaveCycle();render();}

    function resolveEvent(id){if(!run||run.resolved)return;const choice=run.event?.choices?.find(c=>c.id===id),effect=choice?.effect||id;if(effect==='heal'){const heal=Math.min(20,run.maxHp-run.hp);run.hp+=heal;run.mp=run.maxMp;addLog('記憶を預け、HP'+heal+'とMPを取り戻した。','good')}else if(effect==='deal'){run.hp=Math.max(1,run.hp-8);run.gold+=70;addLog('未来を買い、70Gを得た。','rare')}else if(effect==='map'){run.discoveryBonus=(run.discoveryBonus||0)+1;run.mp=Math.min(run.maxMp,run.mp+riftMpGain(4));addLog('道筋を読み、遺物候補を増やした。','rare')}else if(effect==='drink'){run.hp=Math.min(run.maxHp,run.hp+12);run.ward+=12;addLog('雨を飲み、HPと守りを得た。','good')}else if(effect==='gamble'){const gain=Math.random()<.5?140:0;run.gold+=gain;addLog('雨の賭けで'+gain+'Gを得た。',gain?'rare':'danger')}else if(effect==='curse'){profile.fragments+=25;riftApplyCurse();addLog('沼の印と欠片25を交換した。','danger')}else if(effect==='power'){run.nextAttack=(run.nextAttack||0)+24;addLog('祭壇の力が次の攻撃へ宿った。','good')}else if(effect==='sacrifice'){run.hp=Math.max(1,run.hp-18);run.gold+=120;addLog('HPを捧げ、120Gを得た。','rare')}else if(effect==='mastery'){profile.mastery[run.heroId]=(profile.mastery[run.heroId]||0)+2;run.hp=Math.min(run.maxHp,run.hp+8);addLog('名前を取り戻し、習熟+2。','good')}else if(effect==='trade'){run.gold+=90;run.maxHp=Math.max(1,run.maxHp-4);run.hp=Math.min(run.hp,run.maxHp);addLog('影と取引し、90Gを得た。','rare')}else if(effect==='scout'){run.enemyWeak=true;addLog('敵の予兆を読み取った。','good')}run.eventChoice=id;run.resolved=true;profile.stats.events=(profile.stats.events||0)+1;riftSaveCycle();sfx.click();render();}
    function resolveRest(){if(!run||run.resolved)return;const factor=run.rule.includes('休息')?.75:1,heal=Math.min(Math.round(32*factor),run.maxHp-run.hp);run.hp+=heal;run.ward+=12;run.mp=Math.min(run.maxMp,run.mp+riftMpGain(6));run.resolved=true;addLog('灯りの窪地でHP'+heal+'回復。','good');riftSaveCycle();sfx.heal();render();}
    function resolveTreasure(){if(!run||run.resolved)return;const found=Math.round(65*run.goldMult);run.gold+=found;run.potions++;run.resolved=true;profile.stats.treasures=(profile.stats.treasures||0)+1;addLog('宝物庫から'+found+'Gとトニックを得た。','rare');riftSaveCycle();sfx.gold();render();}
    function chooseRelic(id){if(!run||run.phase!=='reward'||run.rewardChosen)return;const relic=RELICS.find(r=>r.id===id);if(!relic)return;run.rewardChosen=true;applyRelic(relic);if(!profile.relicsFound.includes(relic.id))profile.relicsFound.push(relic.id);if(run.rule.includes('呪われる')||run.rule.includes('呪物化'))riftApplyCurse();run.phase='reward';riftSaveCycle();sfx.gold();render();}
    function advance(){if(!run||run.busy)return;const route=run.route||routeKinds;if(run.kind==='boss'){if(run.mode==='endless'){run.depth++;run.roomIndex=0;run.rule=DEPTH_RULES[run.depth%DEPTH_RULES.length];run.phase='room';run.rewardChosen=false;enterRoom();return}if(run.roomIndex>=route.length-1){run.phase='victory';bankRun(true);render();return}if(!run.rewardChosen){return}}else if(run.kind==='battle'||run.kind==='elite'){if(!run.rewardChosen)return}else if(run.kind==='event'||run.kind==='rest'||run.kind==='treasure'){if(!run.resolved)return}run.roomIndex++;if(run.roomIndex>=route.length){run.phase='victory';bankRun(true);render();return}run.resolved=false;enterRoom();vibrate();}
    function finishBattle(){if(!run||!run.enemy)return;const enemy=run.enemy;if(enemy.boss&&((run.mode==='bossrush'&&run.roomIndex<run.route.length-1)||run.mode==='endless')){const found=Math.round(enemy.reward*run.goldMult);run.gold+=found;run.kills++;profile.stats.kills++;if(!profile.codex.includes(enemy.id))profile.codex.push(enemy.id);profile.mastery[run.heroId]=(profile.mastery[run.heroId]||0)+1;run.rewardOptions=relicPool();run.phase='reward';run.busy=false;run.rewardChosen=false;addLog(enemy.name+'を越えた。+'+found+'G','rare');riftSaveCycle();sfx.gold();render();return}riftBaseFinishBattle();riftSaveCycle();}

    function resetProfile(){if(!confirm('保存した主人公・ゴールド・記録をすべて削除しますか？'))return;localStorage.removeItem('riftbound-profile-v4');localStorage.removeItem('riftbound-cycle-v1');window.location.reload();}
    app.addEventListener('click',event=>{const el=event.target.closest('[data-action],[data-build],[data-shop],[data-setting]');if(!el)return;if(el.dataset.build){const [heroId,buildId]=el.dataset.build.split('|');selectBuild(heroId,buildId);return}if(el.dataset.shop){buyShopItem(el.dataset.shop);return}if(el.dataset.setting){toggleSetting(el.dataset.setting);return}const action=el.dataset.action;if(action==='resume'){resumeRun()}else if(action==='daily'){startRun(profile.depth,'daily')}else if(action==='weekly'){startRun(profile.depth,'weekly')}else if(action==='bossrush'){startRun(profile.depth,'bossrush')}else if(action==='endless'){startRun(profile.depth,'endless')}else if(action==='rebirth'){performRebirth()}});
    function render(){let html=ui.screen==='title'?renderTitle():ui.screen==='home'?renderHome():ui.screen==='run'?renderRun():renderEnd(ui.screen==='victory');app.innerHTML=html+(ui.toast?'<div class="toast" role="status">'+esc(ui.toast)+'</div>':'');app.classList.toggle('reduce-motion',profile.settings.reduceMotion);app.classList.toggle('large-text',profile.settings.largeText);}
    const riftRelicPool=()=>{const weeklyExtra=run?.mode==='weekly'&&run.rule.includes('遺物候補+1')?1:0;const count=Math.min(5,2+(profile.upgrades.discovery||0)+(run?.discoveryBonus||0)+weeklyExtra);return[...RELICS].sort(()=>Math.random()-.5).slice(0,count)};
    function enterRoom(){const route=run.route||routeKinds;run.kind=route[run.roomIndex];run.region=run.kind==='boss'?3:Math.min(2,Math.floor(run.roomIndex/3));run.enemy=null;run.event=null;run.resolved=false;run.rewardChosen=false;run.rewardOptions=[];run.phase='room';run.anim='idle';run.busy=false;run.ward=run.buildId==='guardian'?8:0;if(run.roomIndex===0){run.ward+=(profile.shopWard||0);profile.shopWard=0}run.log=[];profile.stats.rooms++;if(run.kind==='battle'||run.kind==='elite'||run.kind==='boss'){run.enemy=makeEnemy(run.kind);addLog(run.kind==='boss'?'最後の冠が、あなたの名前を呼んだ。':'裂け目から新しい敵が現れた。','danger')}if(run.kind==='event'){const base=EVENTS[(run.roomIndex+run.depth+run.seed)%EVENTS.length],branch=RIFT_EVENT_BRANCHES[(run.roomIndex+run.depth+run.seed)%RIFT_EVENT_BRANCHES.length];run.event={...base,choices:branch.choices.map(c=>({...c}))};}riftSaveCycle();render();}
    function enemyTurn(){if(!run||!run.enemy||run.enemy.hp<=0)return;run.anim='enemy';render();setTimeout(()=>{if(!run||ui.screen!=='run')return;const enemy=run.enemy;let raw=enemy.atk[0]+Math.floor(Math.random()*(enemy.atk[1]-enemy.atk[0]+1));if(run.enemyWeak)raw=Math.max(1,Math.round(raw*.75));if(run.mode==='weekly'&&run.rule.includes('通常攻撃の次')&&run.lastAction==='attack')raw=Math.round(raw*1.25);if(enemy.id==='sentinel'&&run.ward)raw+=8;const blocked=Math.min(run.ward,raw);run.ward-=blocked;let damage=raw-blocked;if(run.relics.includes('mirror')&&Math.random()<.2){const reflected=10;enemy.hp=Math.max(0,enemy.hp-reflected);addLog('砕けた鏡が'+reflected+'ダメージを返した。','rare')}if(run.relics.includes('thorn')&&run.ward>0){enemy.hp=Math.max(0,enemy.hp-10);addLog('棘の聖句が敵を刺した。','rare')}if(blocked)addLog('守りが'+blocked+'ダメージを吸収した。','good');if(damage){run.hp=Math.max(0,run.hp-damage);addLog(enemy.name+'の攻撃。'+damage+'ダメージ。','danger')}else addLog('敵の攻撃をすべて防いだ。','good');if(run.kind==='boss'&&run.turn%3===0){run.mp=Math.max(0,run.mp-4);addLog('冠がMPを4奪った。','danger')}sfx.enemy();run.anim='idle';run.busy=false;run.turn++;riftSaveCycle();if(run.hp<=0){run.phase='defeat';bankRun(false);render();vibrate(16);return}render();vibrate(16)},360)}
    function playerAction(type,skill){if(!run||run.busy||run.phase!=='room'||!run.enemy||run.resolved)return;const hero=heroById(run.heroId),build=riftBuildFor(run.buildId);run.busy=true;run.anim=type==='skill'?'skill':type==='heal'?'heal':'player';let damage=0,message='';if(type==='attack'){damage=run.atk+Math.floor(Math.random()*7);if(run.relics.includes('blood'))damage+=6;message='通常攻撃。'+damage+'ダメージ。';sfx.attack()}else if(type==='skill'){if(!skill||run.mp<skill.cost){toast('MPが足りません');run.busy=false;run.anim='idle';return}run.mp-=skill.cost;const values={crescent:28,flare:38,shatter:32,ward:16,prayer:18,starfall:46,riposte:34,tide:34,undertow:42,hex:45,omen:24,hammer:42,fortress:30,flash:36,jackpot:27,null:50,echo:22,temper:48,overclock:44};damage=values[skill.id]??(hero.atk+18);if(build.id==='arcane')damage=Math.round(damage*1.12);if(run.relics.includes('ember'))damage+=8;if(['prayer','tide','echo'].includes(skill.id)){const heal=Math.min(skill.id==='tide'?32:22,run.maxHp-run.hp);run.hp+=heal;addLog(skill.name+'でHPが'+heal+'回復した。','good')}if(['ward','bulwark','fortress','echo'].includes(skill.id)){const guard=skill.id==='fortress'?38:skill.id==='bulwark'?30:skill.id==='echo'?12:16;run.ward+=guard;addLog('守りを'+guard+'得た。','good')}if(['crescent','bulwark','riposte','omen','hammer','temper'].includes(skill.id))run.nextAttack=(run.nextAttack||0)+(skill.id==='hammer'?14:10);if(skill.id==='jackpot'){run.gold+=40;addLog('大当たりで40Gを得た。','rare')}message=skill.name+'。'+damage+'ダメージ。';sfx.skill()}else if(type==='guard'){run.ward+=18;message='身構えた。守り+18。';sfx.click()}else if(type==='heal'){if(run.potions<1||run.hp>=run.maxHp){run.busy=false;run.anim='idle';return}run.potions--;const heal=Math.min(22+(run.relics.includes('tonic')?15:0),run.maxHp-run.hp);run.hp+=heal;message='トニックでHPが'+heal+'回復。';sfx.heal()}if(run.nextAttack&&type==='attack'){damage+=run.nextAttack;run.nextAttack=0}if(damage){run.enemy.hp=Math.max(0,run.enemy.hp-damage);addLog(message,'good')}else addLog(message,'good');render();vibrate();setTimeout(()=>{if(!run||ui.screen!=='run')return;if(run.enemy.hp<=0){finishBattle();return}enemyTurn()},type==='skill'?560:430)}
    function finishBattle(){if(!run||!run.enemy)return;const enemy=run.enemy,route=run.route||routeKinds,found=Math.round(enemy.reward*run.goldMult);run.gold+=found;run.kills++;profile.stats.kills++;if(!profile.codex.includes(enemy.id))profile.codex.push(enemy.id);profile.mastery[run.heroId]=(profile.mastery[run.heroId]||0)+1;unlockAchievement('achievement-'+Math.min(100,profile.stats.kills));if(enemy.boss&&((run.mode==='bossrush'&&run.roomIndex<route.length-1)||run.mode==='deep'||run.mode==='endless')){run.rewardOptions=riftRelicPool();run.phase='reward';run.rewardChosen=false;run.busy=false;run.anim='player';addLog(enemy.name+'を越えた。+'+found+'G','rare');riftSaveCycle();sfx.gold();render();return}if(enemy.boss){run.phase='victory';run.anim='idle';bankRun(true);sfx.win();render();return}run.rewardOptions=riftRelicPool();run.rewardChosen=false;run.phase='reward';run.busy=false;run.anim='player';addLog(enemy.name+'を倒した。+'+found+'G','rare');riftSaveCycle();sfx.gold();render();}
    function playerAction(type,skill){if(!run||run.busy||run.phase!=='room'||!run.enemy||run.resolved)return;const hero=heroById(run.heroId),build=riftBuildFor(run.buildId);run.busy=true;run.lastAction=type;run.anim=type==='skill'?'skill':type==='heal'?'heal':'player';let damage=0,message='';if(type==='attack'){damage=run.atk+Math.floor(Math.random()*7);if(run.relics.includes('blood'))damage+=6;message='通常攻撃。'+damage+'ダメージ。';sfx.attack()}else if(type==='skill'){if(!skill||run.mp<skill.cost){toast('MPが足りません');run.busy=false;run.anim='idle';return}run.mp-=skill.cost;const values={crescent:28,flare:38,shatter:32,ward:16,prayer:18,starfall:46,riposte:34,tide:34,undertow:42,hex:45,omen:24,hammer:42,fortress:30,flash:36,jackpot:27,null:50,echo:22,temper:48,overclock:44,focus:24,ultimate:68};damage=values[skill.id]??(hero.atk+18);if(build.id==='arcane')damage=Math.round(damage*1.12);if(run.relics.includes('ember'))damage+=8;if(['prayer','tide','echo','ultimate'].includes(skill.id)){const heal=Math.min(skill.id==='tide'?32:skill.id==='ultimate'?10:22,run.maxHp-run.hp);run.hp+=heal;addLog(skill.name+'でHPが'+heal+'回復した。','good')}if(['ward','bulwark','fortress','echo','ultimate'].includes(skill.id)){const guard=skill.id==='fortress'?38:skill.id==='bulwark'?30:skill.id==='echo'?12:skill.id==='ultimate'?10:16;run.ward+=guard;addLog('守りを'+guard+'得た。','good')}if(['crescent','bulwark','riposte','omen','hammer','temper','focus'].includes(skill.id))run.nextAttack=(run.nextAttack||0)+(skill.id==='hammer'?14:skill.id==='focus'?6:10);if(skill.id==='focus')run.mp=Math.min(run.maxMp,run.mp+riftMpGain(6));if(skill.id==='jackpot'){run.gold+=40;addLog('大当たりで40Gを得た。','rare')}message=skill.name+'。'+damage+'ダメージ。';sfx.skill()}else if(type==='guard'){run.ward+=18;message='身構えた。守り+18。';sfx.click()}else if(type==='heal'){if(run.potions<1||run.hp>=run.maxHp){run.busy=false;run.anim='idle';return}run.potions--;const heal=Math.min(22+(run.relics.includes('tonic')?15:0),run.maxHp-run.hp);run.hp+=heal;message='トニックでHPが'+heal+'回復。';sfx.heal()}if(run.nextAttack&&type==='attack'){damage+=run.nextAttack;run.nextAttack=0}if(damage){run.enemy.hp=Math.max(0,run.enemy.hp-damage);addLog(message,'good')}else addLog(message,'good');render();vibrate();setTimeout(()=>{if(!run||ui.screen!=='run')return;if(run.enemy.hp<=0){finishBattle();return}enemyTurn()},type==='skill'?560:430)}
    function renderChallenges(){const w=RIFT_WEEKLY_RULES[riftWeekIndex()%RIFT_WEEKLY_RULES.length];return '<section class="panel"><div class="section-label">CHALLENGES · 毎日と毎週の遊び方</div><p class="screen-subtitle">同じ部屋でも、固定条件・深度・長期ルートで違う判断を迫られます。</p><div class="choice-list"><button class="choice" data-action="daily" style="--room-color:var(--violet)"><span class="choice-icon">✦</span><span class="choice-copy"><strong>デイリー裂け目</strong><small>今日の規則：'+DEPTH_RULES[new Date().getDate()%DEPTH_RULES.length]+' · 報酬と実績対象</small></span><b>↗</b></button><button class="choice" data-action="weekly" style="--room-color:var(--blue)"><span class="choice-icon">W</span><span class="choice-copy"><strong>ウィークリー契約</strong><small>今週の条件：'+w+' · 週勝利 '+profile.weeklyWins+'</small></span><b>↗</b></button><button class="choice" data-action="deep" style="--room-color:var(--mint)"><span class="choice-icon">↓</span><span class="choice-copy"><strong>深層サイクル</strong><small>4エリアを連結する26部屋の長期ルート</small></span><b>↗</b></button><button class="choice" data-action="bossrush" style="--room-color:var(--red)"><span class="choice-icon">♛</span><span class="choice-copy"><strong>ボス連戦</strong><small>3体のボスを遺物ビルドで突破する</small></span><b>↗</b></button><button class="choice" data-action="endless" style="--room-color:var(--gold)"><span class="choice-icon">∞</span><span class="choice-copy"><strong>エンドレス</strong><small>深度を更新し、自己ベストを記録する</small></span><b>↗</b></button></div></section><section class="panel"><div class="section-label">LONG RUN TRACKER</div><div class="stat-grid"><div class="stat"><strong>'+profile.challengeWins+'</strong><small>挑戦勝利</small></div><div class="stat"><strong>'+profile.weeklyWins+'</strong><small>週勝利</small></div><div class="stat"><strong>'+profile.endlessBest+'</strong><small>最深エンドレス</small></div><div class="stat"><strong>'+profile.codex.length+'/'+ENEMIES.length+'</strong><small>敵図鑑</small></div></div></section>';}
    app.addEventListener('click',event=>{const el=event.target.closest('[data-action]');if(!el)return;const action=el.dataset.action;if(action==='deep'){startRun(profile.depth,'deep');run.route=Array.from({length:26},(_,i)=>routeKinds[i%routeKinds.length]);riftSaveCycle();render()}else if(action==='sound'){profile.settings.sound=ui.sound;save()}});
    function render(){const ended=ui.screen==='run'&&run&&(run.phase==='defeat'||run.phase==='victory');let html=ui.screen==='title'?renderTitle():ui.screen==='home'?renderHome():ended?renderEnd(run.phase==='victory'):renderRun();app.innerHTML=html+(ui.toast?'<div class="toast" role="status">'+esc(ui.toast)+'</div>':'');app.classList.toggle('reduce-motion',profile.settings.reduceMotion);app.classList.toggle('large-text',profile.settings.largeText);}
    render();
