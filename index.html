  <script>

      {id:'wanderer',name:'蒼影の旅人',role:'均衡',color:'#59e3c0',image:'player.png',hp:100,mp:24,atk:14,cost:0,desc:'通常攻撃と守りを使い分ける、最初の一人。',skills:[{id:'crescent',name:'月影の連撃',cost:5,icon:'╱',desc:'28ダメージ。次の通常攻撃+6。'},{id:'ward',name:'虚ろの守り',cost:7,icon:'⬟',desc:'16ダメージを防ぐ。次の被ダメージ-4。'}]},

    const tone=(from,to,duration=.12,type='square',volume=.035)=>{if(!ui.sound)return;const C=window.AudioContext||window.webkitAudioContext;if(!C)return;if(!audioContext)audioContext=new C();if(audioContext.state==='suspended')audioContext.resume();const now=audioContext.currentTime,o=audioContext.createOscillator(),g=audioContext.createGain();o.type=type;o.frequency.setValueAtTime(from,now);o.frequency.exponentialRampToValueAtTime(Math.max(20,to),now+duration);g.gain.setValueAtTime(.0001,now);g.gain.exponentialRampToValueAtTime(volume,now+.012);g.gain.exponentialRampToValueAtTime(.0001,now+duration);o.connect(g);g.connect(audioContext.destination);o.start(now);o.stop(now+duration+.02)};
    const sfx={click:()=>tone(420,640,.08,'triangle',.025),attack:()=>{tone(180,780,.13,'sawtooth',.045);setTimeout(()=>tone(100,55,.08,'square',.025),45)},skill:()=>{tone(280,920,.22,'triangle',.05);setTimeout(()=>tone(620,1180,.2,'sine',.035),80)},enemy:()=>tone(140,45,.18,'sawtooth',.045),heal:()=>{tone(360,780,.17,'triangle',.035);setTimeout(()=>tone(540,1080,.16,'triangle',.03),90)},gold:()=>tone(520,920,.14,'sine',.035),win:()=>[0,100,200].forEach((d,i)=>setTimeout(()=>tone(360+i*120,720+i*160,.18,'triangle',.04),d))};

    function startRun(depth=profile.depth){const hero=heroById(profile.selectedHero);const u=upgradeStats();run={heroId:hero.id,depth,roomIndex:0,kind:null,region:0,maxHp:hero.hp+u.hp,maxMp:hero.mp+u.mp,hp:0,mp:0,atk:hero.atk+u.atk,ward:0,potions:2,gold:0,goldMult:u.gold,busy:false,anim:'idle',enemy:null,event:null,resolved:false,phase:'room',relics:[],rewardOptions:[],rewardChosen:false,turn:0,log:[],banked:false,kills:0};run.hp=run.maxHp;run.mp=run.maxMp;profile.stats.runs++;save();ui.screen='run';enterRoom();sfx.click();vibrate();}

    function makeEnemy(kind){if(kind==='boss'){const scale=1+run.depth*.09;return{id:'crown',name:'虚ろの冠',desc:'千回の敗北の記憶をまとった、王のない王。',image:'enemy.png',max:260*scale,hp:260*scale,atk:[18+run.depth,27+run.depth],reward:260,intent:'冠の一撃・守り破壊',boss:true}}const pool=run.kind==='elite'?ENEMIES.slice(2):ENEMIES;const base=pool[Math.floor(Math.random()*pool.length)];const scale=1+run.depth*.09+run.roomIndex*.055;return{...base,max:Math.round(base.hp*scale),hp:Math.round(base.hp*scale),atk:base.atk.map(v=>Math.round(v*(1+run.depth*.05))),boss:false};}
    const relicPool=()=>{const count=Math.min(3,2+(profile.upgrades.discovery||0));return[...RELICS].sort(()=>Math.random()-.5).slice(0,count)};
    function applyRelic(relic){run.relics.push(relic.id);relic.apply(run);if(relic.id==='coin')run.goldMult+=.25;addLog('遺物「'+relic.name+'」を選んだ。','rare');}
    function enemyTurn(){if(!run||!run.enemy||run.enemy.hp<=0)return;run.anim='enemy';render();setTimeout(()=>{if(!run||ui.screen!=='run')return;const enemy=run.enemy;let raw=enemy.atk[0]+Math.floor(Math.random()*(enemy.atk[1]-enemy.atk[0]+1));if(enemy.id==='sentinel'&&run.ward)raw+=8;const blocked=Math.min(run.ward,raw);run.ward-=blocked;let damage=raw-blocked;if(run.relics.includes('mirror')&&Math.random()<.2){const reflected=10;enemy.hp=Math.max(0,enemy.hp-reflected);addLog('砕けた鏡が'+reflected+'ダメージを返した。','rare')}if(run.relics.includes('thorn')&&run.ward>0){enemy.hp=Math.max(0,enemy.hp-10);addLog('棘の聖句が敵を刺した。','rare')}if(blocked)addLog('守りが'+blocked+'ダメージを吸収した。','good');if(damage){run.hp=Math.max(0,run.hp-damage);addLog(enemy.name+'の攻撃。'+damage+'ダメージ。','danger')}else addLog('敵の攻撃をすべて防いだ。','good');if(run.kind==='boss'&&run.turn%3===0){run.mp=Math.max(0,run.mp-4);addLog('冠がMPを4奪った。','danger')}sfx.enemy();run.anim='idle';run.busy=false;run.turn++;if(run.hp<=0){run.phase='defeat';bankRun(false);render();vibrate(16);return}render();vibrate(16)},360)}
    function playerAction(type,skill){if(!run||run.busy||run.phase!=='room'||!run.enemy||run.resolved)return;const hero=heroById(run.heroId);run.busy=true;run.anim=type==='skill'?'skill':type==='heal'?'heal':'player';let damage=0;let message='';if(type==='attack'){damage=run.atk+Math.floor(Math.random()*7);if(run.relics.includes('blood'))damage+=6;message='通常攻撃。'+damage+'ダメージ。';sfx.attack()}else if(type==='skill'){if(run.mp<skill.cost){toast('MPが足りません');run.busy=false;run.anim='idle';return}run.mp-=skill.cost;damage=skill.id==='crescent'?28:skill.id==='flare'?38:skill.id==='shatter'?32:skill.id==='ward'?16:skill.id==='prayer'?18:30;if(run.relics.includes('ember'))damage+=8;if(skill.id==='prayer'){const heal=Math.min(26,run.maxHp-run.hp);run.hp+=heal;addLog('灰の祈りでHPが'+heal+'回復した。','good')}if(skill.id==='ward'||skill.id==='bulwark'){run.ward+=skill.id==='bulwark'?30:16;addLog('守りを'+(skill.id==='bulwark'?30:16)+'得た。','good')}if(skill.id==='crescent'||skill.id==='bulwark')run.nextAttack=(run.nextAttack||0)+(skill.id==='bulwark'?10:6);message=skill.name+'。'+damage+'ダメージ。';sfx.skill()}else if(type==='guard'){run.ward+=18;message='身構えた。守り+18。';sfx.click()}else if(type==='heal'){if(run.potions<1||run.hp>=run.maxHp){run.busy=false;run.anim='idle';return}run.potions--;const heal=Math.min(22+(run.relics.includes('tonic')?15:0),run.maxHp-run.hp);run.hp+=heal;message='トニックでHPが'+heal+'回復。';sfx.heal()}if(run.nextAttack&&type==='attack'){damage+=run.nextAttack;run.nextAttack=0}if(damage){run.enemy.hp=Math.max(0,run.enemy.hp-damage);addLog(message,'good')}else addLog(message,'good');render();vibrate();setTimeout(()=>{if(!run||ui.screen!=='run')return;if(run.enemy.hp<=0){finishBattle();return}enemyTurn()},type==='skill'?560:430)}

    function renderHeader(){return '<div class="app-header"><div><div class="mini-brand">RIFT<span>BOUND</span></div><div class="version">裂け目の記録帳</div></div><div class="wallet">● '+fmt(profile.gold)+'<small>G</small></div></div>'}
    function renderHome(){const tab=ui.tab;let body=tab==='heroes'?renderHeroes():tab==='tree'?renderTree():tab==='gacha'?renderGacha():renderCodex();return '<div class="shell screen">'+renderHeader()+'<div class="stat-grid"><div class="stat"><strong>'+profile.stats.runs+'</strong><small>サイクル</small></div><div class="stat"><strong>'+profile.stats.wins+'</strong><small>勝利</small></div><div class="stat"><strong>'+profile.stats.kills+'</strong><small>討伐</small></div><div class="stat"><strong>'+profile.depth+'</strong><small>深度</small></div></div><button class="primary" data-action="start"><span>'+heroById(profile.selectedHero).name+'で出撃する</span><b>↗</b></button><div class="screen-title">旅人の記録</div><p class="screen-subtitle">主人公、永続強化、召喚、図鑑。毎サイクルの選択が次の旅を変える。</p><nav class="tabbar"><button class="tab '+(tab==='heroes'?'active':'')+'" data-tab="heroes">主人公</button><button class="tab '+(tab==='tree'?'active':'')+'" data-tab="tree">スキルツリー</button><button class="tab '+(tab==='gacha'?'active':'')+'" data-tab="gacha">召喚</button><button class="tab '+(tab==='codex'?'active':'')+'" data-tab="codex">図鑑</button></nav>'+body+(ui.how?renderHow():'')+'<div class="footer-row"><button data-action="how">遊び方</button><button data-action="sound">'+(ui.sound?'効果音 ON':'効果音 OFF')+'</button><button data-action="reset" style="color:var(--red)">記録を初期化</button></div></div>';}
    function heroCard(hero){const unlocked=isUnlocked(hero.id),selected=profile.selectedHero===hero.id,level=levelFor(hero.id);return '<article class="hero-card '+(selected?'selected ':'')+(unlocked?'':'locked')+'" style="--hero-color:'+hero.color+';--hero-filter:'+(hero.filter||'none')+'"><div class="hero-art"><img src="'+asset(hero.image)+'" alt="'+esc(hero.name)+'"></div><div class="hero-copy"><div class="hero-title"><strong>'+esc(hero.name)+'</strong><span class="role">'+hero.role+'</span></div><p class="hero-description">'+esc(hero.desc)+'</p><div class="hero-stats"><span>HP <b>'+hero.hp+'</b></span><span>MP <b>'+hero.mp+'</b></span><span>ATK <b>'+hero.atk+'</b></span></div><div class="skills-preview">'+hero.skills.map(s=>'<span class="skill-chip">'+s.icon+' '+s.name+'</span>').join('')+'</div><div class="hero-footer"><span class="mastery">習熟 Lv.'+level+' · XP '+(profile.mastery[hero.id]||0)+'</span>'+(unlocked?'<button class="small-button '+(selected?'accent':'')+'" data-hero="'+hero.id+'">'+(selected?'選択中':'選ぶ')+'</button>':'<button class="small-button accent" data-hero="'+hero.id+'">'+hero.cost+'Gで解放</button>')+'</div></div></article>';}
    function renderHeroes(){return '<section class="panel"><div class="section-label">HERO ROSTER · '+profile.unlockedHeroes.length+'/'+HEROES.length+'</div><div class="hero-list">'+HEROES.map(heroCard).join('')+'</div></section><div class="tip">通常攻撃はMPを消費しません。固有スキルでMPを使い、HPとリソースを管理して次のサイクルへ進みます。</div>';}
    function renderTree(){return '<section class="panel"><div class="section-label">永続スキルツリー · 次のサイクルに持ち越す</div><p class="screen-subtitle">サイクルで得たゴールドを使い、攻撃・HP・MP・ゴールド取得倍率を育てます。</p><div class="upgrade-list">'+UPGRADES.map(u=>{const level=profile.upgrades[u.id]||0,cost=nextCost(u);return '<button class="upgrade" data-upgrade="'+u.id+'" style="--upgrade-color:'+u.color+'" '+(level>=u.max?'disabled':'')+'><span class="upgrade-icon">'+u.icon+'</span><span class="upgrade-copy"><strong>'+u.name+'</strong><small>'+u.desc+'</small><span class="upgrade-cost">'+(level>=u.max?'MAX':'次の強化 '+cost+'G')+'</span></span><span class="upgrade-level">'+level+'/'+u.max+'</span></button>'}).join('')+'</div></section><div class="tip">現在の強化は、勝利でも敗北でも確保したゴールドで購入できます。敗北を無駄にしないのがRiftboundの基本方針です。</div>'}
    function renderGacha(){return '<section class="panel"><div class="gacha-box"><div class="gacha-orb">✦</div><h3>裂け目召喚</h3><p>未所持の主人公をゲーム内ゴールドで迎え入れます。5回目の召喚は未所持主人公を確定。重複は欠片40個へ変換されます。</p><button class="pull-button" data-action="gacha">1回召喚する<b>● 160G · '+profile.pulls+'回目</b></button></div></section><section class="panel"><div class="section-label">欠片</div><div class="row"><strong style="font-size:28px;color:var(--violet)">◆ '+profile.fragments+'</strong><span style="color:var(--muted);font-size:11px">主人公の習熟・交換に使用</span></div></section><div class="tip">性能を持つ全主人公は、召喚を使わなくてもゴールドで直接解放できます。課金・広告・スタミナはありません。</div>';}
    function renderCodex(){const seen=profile.stats.kills>0;return '<section class="panel"><div class="section-label">ENEMY CODEX · 討伐 '+profile.stats.kills+'体</div><div class="codex-grid">'+ENEMIES.map((e,i)=>'<div class="codex-card '+(seen||i===0?'':'locked')+'"><img src="'+asset(e.image)+'" alt="'+(seen?esc(e.name):'未知の敵')+'"><strong>'+(seen?e.name:'???')+'</strong><small>'+(seen?e.desc:'敵を倒すと記録が解放される')+'</small></div>').join('')+'</div></section><section class="panel"><div class="section-label">ACHIEVEMENTS</div><div class="choice-list"><div class="choice" style="--room-color:var(--gold)"><span class="choice-icon">★</span><span class="choice-copy"><strong>最初の勝利</strong><small>'+ (profile.achievements.firstWin?'達成済み':'虚ろの冠を倒す')+'</small></span><b>'+(profile.achievements.firstWin?'✓':'○')+'</b></div><div class="choice" style="--room-color:var(--violet)"><span class="choice-icon">∞</span><span class="choice-copy"><strong>深度の探究者</strong><small>裂け目深度3へ到達</small></span><b>'+(profile.achievements.deep?'✓':'○')+'</b></div></div></section>';}
    function renderRun(){const hero=heroById(run.heroId),region=REGIONS[run.region];return '<div class="shell screen run-screen"><div class="run-header"><div><div class="run-name">'+hero.name+'</div><div class="run-region">'+region.name+' · '+(run.depth?'裂け目深度 '+run.depth:'標準サイクル')+'</div></div><div class="run-wallet">● '+fmt(run.gold)+'G</div></div><div class="run-meta"><span>ROOM '+(run.roomIndex+1)+' / '+routeKinds.length+'</span><span class="depth-badge">HP '+Math.max(0,Math.floor(run.hp))+' / '+run.maxHp+'</span><span class="depth-badge">MP '+Math.floor(run.mp)+' / '+run.maxMp+'</span></div><div class="progress-line"><i style="width:'+((run.roomIndex)/ (routeKinds.length-1)*100)+'%"></i></div>'+renderRoute()+renderRoom()+ '<div class="run-footer"><button class="ghost" data-action="abandon">ホームへ戻る</button><button class="ghost" data-action="sound">'+(ui.sound?'効果音 ON':'効果音 OFF')+'</button></div></div>';}
    function renderRoute(){return '<div class="route">'+routeKinds.map((kind,i)=>'<div class="route-node '+(i<run.roomIndex?'done ':'')+(i===run.roomIndex?'current':'')+'" style="--room-color:'+roomMeta[kind].color+'">'+(i<run.roomIndex?'✓':roomMeta[kind].icon)+'</div>').join('')+'</div>';}
    function bar(value,max,cls){return '<div class="'+cls+'"><i style="width:'+Math.max(0,Math.min(100,value/max*100))+'%"></i></div>';}
    function renderDuel(){const hero=heroById(run.heroId),enemy=run.enemy;return '<div class="combat-head"><span class="intent">予告 · '+enemy.intent+'</span><span style="color:var(--muted);font-size:10px">'+(enemy.boss?'BOSS':'ENEMY')+'</span></div><div class="duel anim-'+run.anim+'"><div class="fighter player-fighter"><div class="fighter-label"><span>'+hero.name+'</span><strong>'+Math.floor(run.hp)+' HP</strong></div>'+bar(run.hp,run.maxHp,'hp-track player-hp')+bar(run.mp,run.maxMp,'mp-track')+'<img src="'+asset(hero.image)+'" style="filter:'+(hero.filter||'none')+'" alt="'+esc(hero.name)+'のドット絵"></div><div class="duel-vs">VS</div><div class="fighter enemy-fighter"><div class="fighter-label"><span>敵</span><strong>'+Math.ceil(enemy.hp)+' HP</strong></div>'+bar(enemy.hp,enemy.max,'hp-track enemy-hp')+'<div class="mp-track" style="opacity:0"></div><img src="'+asset(enemy.image)+'" alt="'+esc(enemy.name)+'のドット絵"></div></div>'}
    function actionButton(action,icon,title,detail,cost,color,disabled=false,wide=false){return '<button class="action '+(wide?'wide':'')+'" data-action="'+action+'" style="--action-color:'+color+'" '+(disabled?'disabled':'')+'><span class="action-icon">'+icon+'</span><span class="action-copy"><strong>'+title+'</strong><small>'+detail+'</small></span><span class="action-cost">'+cost+'</span></button>';}
    function renderLog(){return run.log.length?'<div class="log"><div class="log-title">RUN LOG</div>'+run.log.map(x=>'<div class="log-line '+x.tone+'"><i></i><span>'+esc(x.text)+'</span></div>').join('')+'</div>':'';}
    function renderCombatRoom(meta){const enemy=run.enemy;if(run.phase==='reward'){return renderDuel()+'<div class="outcome" style="--room-color:'+meta.color+'">✦ <span>'+esc(enemy.name)+'を撃破 · ゴールドを確保</span></div>'+(run.rewardChosen?'<div class="outcome" style="--room-color:var(--gold)">◆ <span>「'+esc(RELICS.find(r=>r.id===run.relics[run.relics.length-1])?.name||'遺物')+'」を装備中</span></div>':'<div class="relic-list">'+run.rewardOptions.map(r=>'<button class="relic" data-relic="'+r.id+'"><strong>◆ '+r.name+'</strong><p>'+r.desc+'</p><em>'+r.tag+'</em></button>').join('')+'</div>')+'<div class="continue">'+(run.rewardChosen?actionButton('advance','→','次の部屋へ','ビルドを持って進む','',meta.color):'<div class="tip">遺物を1つ選ぶと、次の部屋へ進めます。</div>')+'</div>'+renderLog()}return renderDuel()+'<div class="actions">'+actionButton('attack','╱','通常攻撃','MPを消費しない基本攻撃','MP 0',varColor('mint'),run.busy)+heroById(run.heroId).skills.map(s=>actionButton('skill-'+s.id,s.icon,s.name,s.desc,'MP '+s.cost,varColor('violet'),run.busy||run.mp<s.cost)).join('')+actionButton('guard','⬟','守る','守り+18。次の敵攻撃を軽減。','TURN',varColor('blue'),run.busy)+actionButton('heal','◆','トニック','HPを回復。敵にターンを渡す。','×'+run.potions,varColor('gold'),run.busy||run.potions<1||run.hp>=run.maxHp)+'</div>'+renderLog();}
    const varColor=name=>name==='mint'?'#59e3c0':name==='violet'?'#aa8dff':name==='blue'?'#76b4ff':'#ffca60';
    function renderRoom(){const meta=roomMeta[run.kind],style='style="--room-color:'+meta.color+'"';let body='';if(run.kind==='battle'||run.kind==='elite'||run.kind==='boss')body=renderCombatRoom(meta);else if(run.kind==='event'){body='<p class="event-copy">'+run.event.copy+'</p>'+(run.resolved?'<div class="outcome" '+style+'>✦ <span>祠の記憶を背に、先へ進める。</span></div><div class="continue">'+actionButton('advance','→','歩みを進める','ルートはまだ続いている','',meta.color)+'</div>':'<div class="choice-list">'+run.event.choices.map(c=>'<button class="choice" data-event="'+c.id+'" '+style+'><span class="choice-icon">'+c.icon+'</span><span class="choice-copy"><strong>'+c.title+'</strong><small>'+c.detail+'</small></span><b>›</b></button>').join('')+'</div>')}else if(run.kind==='rest'){body='<p class="event-copy">青い火が窪地に集まっている。短い休息は、鋭い刃より価値がある。</p>'+(run.resolved?'<div class="outcome" '+style+'>♥ <span>HP、MP、守りを少し取り戻した。</span></div><div class="continue">'+actionButton('advance','→','窪地を出る','道は次の判断を待っている','',meta.color)+'</div>':actionButton('rest','♨','灯りのそばで休む','HP32回復・MP6回復・守り+12','',meta.color))}else{body='<p class="event-copy">真鍮の宝箱が、灰の下でまだ温かい。開くなら今しかない。</p>'+(run.resolved?'<div class="outcome" '+style+'>◇ <span>ゴールドとトニックを手に入れた。</span></div><div class="continue">'+actionButton('advance','→','宝物庫を出る','見つけたものを持って進む','',meta.color)+'</div>':actionButton('treasure','◇','宝物庫を開く','ゴールド・トニック・記録を獲得','',meta.color))}return '<section class="room-card" '+style+'><div class="room-head"><div class="room-icon">'+meta.icon+'</div><div class="room-meta"><span class="room-tag">'+meta.tag+'</span><h2>'+meta.title+'</h2><p>'+meta.sub+'</p></div><span style="color:var(--muted);font:800 9px ui-monospace">'+String(run.roomIndex+1).padStart(2,'0')+'</span></div>'+body+'</section>';}
    function renderEnd(victory){const hero=heroById(run?.heroId||profile.selectedHero),gold=run?Math.floor(run.gold):0;return '<div class="shell screen end-screen '+(victory?'':'defeat')+'"><div class="end-orb">'+(victory?'♛':'☾')+'</div><h1>'+(victory?'裂け目が、あなたを覚えた':'今回は、ここまで')+'</h1><p>'+(victory?'虚ろの冠を越えた。確保したゴールドと主人公の習熟は、次のサイクルへ持ち越されます。':'敗北しても、サイクルで得たゴールドと習熟は失われません。次の一手を変えて再挑戦できます。')+'</p><div class="end-stats"><div><strong>'+gold+'</strong><small>確保G</small></div><div><strong>'+profile.mastery[hero.id]+'</strong><small>'+hero.name+' XP</small></div><div><strong>'+profile.depth+'</strong><small>最高深度</small></div></div><div class="end-actions"><button class="primary" data-action="start"><span>もう一度 '+hero.name+'で進む</span><b>↗</b></button><button class="secondary" data-action="home"><span>⌂</span><span>記録帳へ戻る</span><span>›</span></button></div></div>';}
    function howTo(){ui.how=!ui.how;render();}
    function resetProfile(){if(!confirm('保存した主人公・ゴールド・記録をすべて削除しますか？'))return;localStorage.removeItem('riftbound-profile-v4');profile=loadProfile();ui.screen='title';ui.toast='記録を初期化しました';render();}
    app.addEventListener('click',event=>{const el=event.target.closest('[data-action],[data-tab],[data-hero],[data-upgrade],[data-relic],[data-event]');if(!el)return;const action=el.dataset.action;if(el.dataset.tab){setTab(el.dataset.tab);return}if(el.dataset.hero){selectHero(el.dataset.hero);return}if(el.dataset.upgrade){buyUpgrade(el.dataset.upgrade);return}if(el.dataset.relic){chooseRelic(el.dataset.relic);return}if(el.dataset.event){resolveEvent(el.dataset.event);return}if(action==='home'){ui.screen='home';ui.tab='heroes';sfx.click();render()}else if(action==='start'){startRun(profile.depth)}else if(action==='start-depth'){startRun(profile.depth)}else if(action==='how'){howTo()}else if(action==='sound'){ui.sound=!ui.sound;render()}else if(action==='gacha'){pullGacha()}else if(action==='attack'){playerAction('attack')}else if(action.startsWith('skill-')){const skill=heroById(run.heroId).skills.find(s=>s.id===action.slice(6));playerAction('skill',skill)}else if(action==='guard'){playerAction('guard')}else if(action==='heal'){playerAction('heal')}else if(action==='rest'){resolveRest()}else if(action==='treasure'){resolveTreasure()}else if(action==='advance'){advance()}else if(action==='abandon'){abandon()}else if(action==='reset'){resetProfile()}});
    render();
  </script>
</body>
</html>
